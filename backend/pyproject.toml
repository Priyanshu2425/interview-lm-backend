[project]
name = "interviewer"
version = "0.1.0"
requires-python = ">=3.12"

# Declared here because the Notebook Adapter cannot do its job without them:
# a PDF is the source type Candidates actually have, and an upload is how it
# arrives. The rest of the runtime is installed by the deployment.
dependencies = [
  "pypdf>=5",
  "python-multipart>=0.0.9",
  # Vectors are a column type, not an array of floats: the citation lookup is
  # an index scan and the width is checked by the database (ADR-0017).
  "pgvector>=0.3",
  # Identity is Gatehouse's (ADR-0026), and what arrives here is an RS256
  # bearer token to verify against its published keys. Not written by hand:
  # `aud`, `iss` and `exp` are the whole of the check, and a token library that
  # has been read by more people than this one gets them right.
  # >=2.10 and not >=2.9: `PyJWKClient(headers=...)` arrived in 2.10, and the key
  # set cannot be fetched through Cloudflare without it (identity/tokens.py).
  "pyjwt[crypto]>=2.10",
  # The object store is on the upload path, not only the figure path: a
  # Candidate's document is stored before its row is written (ISSUE-0033), so a
  # deployment with a bucket cannot serve an upload without this. Declared here
  # rather than in the `embeddings` extra, which is what it predates — and
  # `pin_requirements.py` can only see what is declared, so a runtime
  # dependency hiding in an extra is one it silently drops.
  "boto3>=1.34",
]

# The model that ships, and the S3 it is published to. Optional because the
# default deployment runs the lexical stand-in, and because 2.5GB of wheels
# should not be the price of running the test suite.
[project.optional-dependencies]
embeddings = [
  "torch>=2.4",
  "transformers>=4.49",
  "pillow>=10",
  "boto3>=1.34",
  "huggingface-hub>=0.26",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
  "error::DeprecationWarning",
  # starlette's TestClient warns about httpx; not our code to fix
  "ignore:Using `httpx` with `starlette.testclient`:",
]
